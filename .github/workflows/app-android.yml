# Arma la app Android (android/) en GitHub cada vez que cambia algo de la app.
# La .apk queda para bajar en la pestaña "Actions" del repositorio → la última ejecución → "Artifacts".
name: App Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Llave de firma (opcional): si están los secretos, cada versión se instala encima de la anterior.
      - name: Preparar la llave de firma
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/smiles.jks"
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/smiles.jks" >> "$GITHUB_ENV"
          else
            echo "Sin llave de firma: se usa la de prueba."
          fi

      - name: Armar la app
        working-directory: android
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: smiles-app-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

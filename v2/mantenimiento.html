<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smiles Campana | En mantenimiento</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f5fa">
  <!-- Se vuelve a cargar sola cada 2 minutos: cuando termina el mantenimiento, aparece el sitio. -->
  <meta http-equiv="refresh" content="120">
  <link rel="icon" href="/assets/img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
  <!-- Página independiente: no usa los estilos ni el código del sitio, para que se vea aunque lo demás falle. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
      font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #262140; background: #f5f5fa;
      background-image: radial-gradient(circle at 15% 10%, #e8e7f5 0, transparent 45%), radial-gradient(circle at 90% 95%, #fbf1cf 0, transparent 40%);
    }
    main {
      width: 100%; max-width: 32rem; text-align: center; background: #fff; border: 1px solid #dddcea; border-radius: 20px;
      padding: 40px 28px 34px; box-shadow: 0 18px 40px -24px rgba(38, 33, 64, 0.35);
    }
    img { height: 76px; width: auto; display: block; margin: 0 auto 26px; }
    .raya { width: 48px; height: 3px; border-radius: 3px; background: #e6b422; margin: 0 auto 22px; }
    h1 { font-size: clamp(1.25rem, 1.1rem + 0.8vw, 1.55rem); line-height: 1.3; margin: 0 0 14px; font-weight: 650; letter-spacing: -0.01em; }
    p { margin: 0 0 10px; color: #5d5875; font-size: 1.0625rem; line-height: 1.55; }
    .firma { margin-top: 22px; color: #4b4796; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo.png" alt="Smiles Campana">
    <div class="raya" aria-hidden="true"></div>
    <h1>La página se encuentra momentáneamente fuera de servicio.</h1>
    <p>Disculpá las molestias, estamos trabajando para ofrecerte la mejor calidad.</p>
    <p class="firma">Equipo de Smiles Campana</p>
  </main>
</body>
</html>
